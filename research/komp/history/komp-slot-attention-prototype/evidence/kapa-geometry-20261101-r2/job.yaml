apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: kapa-geometry-20261101-r2
  namespace: qiji
  annotations:
    JobAlias: kapa-geometry-20261101-r2
    project: WeaverRSI
spec:
  minAvailable: 1
  schedulerName: volcano
  queue: qiji
  maxRetry: 0
  policies:
    - {event: PodFailed, action: AbortJob}
    - {event: PodEvicted, action: AbortJob}
  tasks:
    - replicas: 1
      name: runner
      template:
        spec:
          activeDeadlineSeconds: 3600
          restartPolicy: Never
          tolerations:
            - {key: task-type, operator: Equal, value: rsi-weaver, effect: NoSchedule}
            - {key: task-type, operator: Equal, value: weaver, effect: NoSchedule}
            - {key: task-type, operator: Equal, value: infra-dev-weaver, effect: NoSchedule}
          volumes:
            - name: gpfs
              hostPath: {path: /gpfs, type: Directory}
            - name: shm
              emptyDir: {medium: Memory, sizeLimit: 4Gi}
          containers:
            - name: runner
              image: harbor.local.clusters/bp/weaver-trainer-megatron-bridge:v1.14.30@sha256:8e310d0cb124813a25683448b41df67331951aae06e17bddcfd3f7692f71520e
              resources:
                requests: {nvidia.com/gpu: '1', cpu: '8', memory: 32Gi}
                limits: {nvidia.com/gpu: '1', cpu: '8', memory: 32Gi}
              volumeMounts:
                - {name: gpfs, mountPath: /gpfs}
                - {name: shm, mountPath: /dev/shm}
              command: [/bin/bash, -lc]
              args:
                - |
                  set -euo pipefail
                  task_dir=/gpfs/users/linlizhi/kapa-geometry-20261101-r2
                  export PYTHONUNBUFFERED=1
                  export OMP_NUM_THREADS=4
                  export TRITON_CACHE_DIR="$task_dir/triton-cache"
                  export CUBLAS_WORKSPACE_CONFIG=:4096:8
                  export PYTHONPATH=/gpfs/users/linlizhi/komp-gsa-gdn-20261031-env/triton371
                  export FLA_DISABLE_BACKEND_DISPATCH=1
                  export FLA_DISABLE_TENSOR_CACHE=1
                  export FLA_SOURCE=/gpfs/users/linlizhi/komp-gsa-gdn-20261031-r1/fla-source
                  exec bash "$task_dir/runner.sh"
