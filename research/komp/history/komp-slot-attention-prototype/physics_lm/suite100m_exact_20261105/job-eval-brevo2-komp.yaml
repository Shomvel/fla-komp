apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: physics100m-eval-brevo2-komp-20261105
  namespace: qiji
  annotations:
    JobAlias: physics100m-eval-brevo2-komp-20261105
    project: WeaverRSI
spec:
  minAvailable: 1
  schedulerName: volcano
  queue: proj-32
  maxRetry: 0
  policies:
    - {event: PodFailed, action: AbortJob}
    - {event: PodEvicted, action: AbortJob}
  tasks:
    - replicas: 1
      name: runner
      template:
        spec:
          activeDeadlineSeconds: 86400
          restartPolicy: Never
          tolerations:
            - {key: task-type, operator: Equal, value: rsi-weaver, effect: NoSchedule}
            - {key: task-type, operator: Equal, value: weaver, effect: NoSchedule}
            - {key: task-type, operator: Equal, value: infra-dev-weaver, effect: NoSchedule}
          volumes:
            - name: gpfs
              hostPath: {path: /gpfs, type: Directory}
            - name: shm
              emptyDir: {medium: Memory, sizeLimit: 32Gi}
          containers:
            - name: runner
              image: harbor.local.clusters/bp/weaver-trainer-megatron-bridge:v1.14.30@sha256:8e310d0cb124813a25683448b41df67331951aae06e17bddcfd3f7692f71520e
              resources:
                requests: {nvidia.com/gpu: '1', cpu: '4', memory: 32Gi}
                limits: {nvidia.com/gpu: '1', cpu: '4', memory: 32Gi}
              volumeMounts:
                - {name: gpfs, mountPath: /gpfs}
                - {name: shm, mountPath: /dev/shm}
              command: [/bin/bash, -lc]
              args:
                - |
                  set -euo pipefail
                  task_dir=/gpfs/users/linlizhi/physics100m-exact-20261105
                  export PYTHONUNBUFFERED=1
                  export OMP_NUM_THREADS=2
                  export TORCH_DISTRIBUTED_DEBUG=DETAIL
                  export TRITON_CACHE_DIR="$task_dir/triton-cache"
                  export CUBLAS_WORKSPACE_CONFIG=:4096:8
                  export PYTHONPATH=/gpfs/users/linlizhi/komp-gsa-gdn-20261031-env/triton371
                  export FLA_DISABLE_BACKEND_DISPATCH=1
                  export FLA_DISABLE_TENSOR_CACHE=1
                  export FLA_SOURCE="$task_dir/snapshot/fla-source"
                  export KOMP_SOURCE="$task_dir/snapshot"
                  export SUITE_DATA=/gpfs/users/linlizhi/physics100m-20261101/data
                  export SUITE_RUNS="$task_dir/runs-ddp"
                  export CUDA_VISIBLE_DEVICES=0
                  python "$task_dir/validate_original_eval_resume.py" --gpu --run brevo2-komp-final-lr0.001-wd0.1-seed731
                  exec python "$task_dir/snapshot/evaluate.py" --run brevo2-komp-final-lr0.001-wd0.1-seed731 >> "$task_dir/logs/eval-brevo2-komp-final-lr0.001-wd0.1-seed731.log" 2>&1
