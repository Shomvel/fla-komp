# Authorized by user: 1 x H100, maximum 45 minutes, independent research only.
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: exact-efficiency-stage1-20261106
  namespace: qiji
  annotations:
    JobAlias: exact-efficiency-stage1-20261106
    project: WeaverRSI
spec:
  minAvailable: 1
  schedulerName: volcano
  queue: proj-32
  maxRetry: 0
  policies:
    - {event: PodFailed, action: AbortJob}
    - {event: PodEvicted, action: AbortJob}
  tasks:
    - replicas: 1
      name: runner
      template:
        spec:
          activeDeadlineSeconds: 2700
          restartPolicy: Never
          tolerations:
            - {key: task-type, operator: Equal, value: rsi-weaver, effect: NoSchedule}
            - {key: task-type, operator: Equal, value: weaver, effect: NoSchedule}
            - {key: task-type, operator: Equal, value: infra-dev-weaver, effect: NoSchedule}
          volumes:
            - name: gpfs
              hostPath: {path: /gpfs, type: Directory}
            - name: shm
              emptyDir: {medium: Memory, sizeLimit: 32Gi}
          containers:
            - name: runner
              image: harbor.local.clusters/bp/weaver-trainer-megatron-bridge:v1.14.30@sha256:8e310d0cb124813a25683448b41df67331951aae06e17bddcfd3f7692f71520e
              resources:
                requests: {nvidia.com/gpu: '1', cpu: '8', memory: 64Gi}
                limits: {nvidia.com/gpu: '1', cpu: '8', memory: 64Gi}
              volumeMounts:
                - {name: gpfs, mountPath: /gpfs}
                - {name: shm, mountPath: /dev/shm}
              command: [/bin/bash, -lc]
              args:
                - |
                  set -euo pipefail
                  task_dir=/gpfs/users/linlizhi/exact-komp-efficiency-research-20261106
                  export PYTHONUNBUFFERED=1 OMP_NUM_THREADS=2 TOKENIZERS_PARALLELISM=false
                  export PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
                  export TRITON_CACHE_DIR="$task_dir/triton-cache-stage1"
                  export CUBLAS_WORKSPACE_CONFIG=:4096:8
                  export PYTHONPATH=/gpfs/users/linlizhi/komp-gsa-gdn-20261031-env/triton371
                  export FLA_DISABLE_BACKEND_DISPATCH=1 FLA_DISABLE_TENSOR_CACHE=1
                  export EXACT_RESEARCH_FIXTURE="$task_dir/fixture"
                  export EXACT_RESEARCH_RESULTS="$task_dir/results-stage1"
                  export EXACT_RESEARCH_STAGE1="$task_dir/results-stage1"
                  cd "$task_dir"
                  exec >> "$task_dir/stage1.log" 2>&1
                  python -c 'import torch,sys,google.protobuf; from google.protobuf.internal.api_implementation import Type; print(sys.version,torch.__version__,torch.cuda.get_device_name(),google.protobuf.__version__,Type()); assert "H100" in torch.cuda.get_device_name()'
                  python prepare_fixture.py --checkpoint "$task_dir/pinned-checkpoint" --manifest baseline/configs/data-manifest.json --out "$task_dir/fixture"
                  python profile_input.py --fixture "$task_dir/fixture" --rank 0 --out "$task_dir/input-profile-rank0.json"
                  bash run_stage1.sh
